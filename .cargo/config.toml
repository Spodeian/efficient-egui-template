# Cargo Configuration for Serverless & Desktop Template

[target.wasm32-unknown-unknown]
rustflags = [
    # 1. Universal baseline WebAssembly instructions (Safe for mobile WebKit/Safari & desktop)
    "-C", "target-feature=+bulk-memory,+mutable-globals,+nontrapping-fptoint,+sign-ext,+reference-types",

    # 2. WASM Stack Size Allocation (2MB headroom for complex layouts & virtual DOM)
    "-C", "link-arg=-zstack-size=2097152",

    # 3. Universal Target CPU
    "-C", "target-cpu=generic",
]
runner = "wasm-bindgen-test-runner"

